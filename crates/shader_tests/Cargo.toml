[package]
name = "shader_tests"
version = "0.1.0"
edition = "2021"
authors = ["Pulsar Team"]
description = "Test suite for WGSL shader compilation"
publish = false

[dependencies]
# Shader compiler
psgc = { path = "../psgc" }

# WGSL node library  
wgsl_std = { path = "../wgsl_std" }

# Graphy for graph construction
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy.git", rev = "938628524993a06464ada010b31a6b4fa4a7a493" }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
